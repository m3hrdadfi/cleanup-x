[project]
name = "cleanup-x"
version = "0.1.0"
description = "Local-first X history cleanup console"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "alembic>=1.14.0",
  "cryptography>=44.0.0",
  "fastapi[standard]>=0.115.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.36",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "respx>=0.22.0",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
